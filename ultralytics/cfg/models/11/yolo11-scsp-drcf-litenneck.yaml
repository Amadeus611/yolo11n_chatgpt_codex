# 面向无人机航拍车辆检测的 SCSP + DRCF + 保守 LiteNeck 结构消融配置。

nc: 80 # 类别数
scales:
  # [深度系数, 宽度系数, 最大通道数]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [来源层, 重复次数, 模块, 参数]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 10-P5/32 语义特征

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 13-P4/16

  - [-1, 1, DySample, [2]] # 保守替换 P4 -> P3 动态上采样
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2Lite, [256, False]] # 16-P3/8 LiteNeck 融合
  - [[1, 10, -1], 1, SCSPDRCF, [0.1]] # 17-P3/8 语义校准细节回放

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 20-P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 23-P5/32

  - [[17, 20, 23], 1, Detect, [nc]]
